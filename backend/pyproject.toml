[project]
name = "annotator"
version = "2.0.0.dev0"
description = "claude-annotator v2: FastAPI backend + worker for AI-assisted object detection labelling"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.10",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.18",
    "httpx>=0.28",
    "pillow>=11.0",
]

[project.optional-dependencies]
# Grounding DINO / YOLO-World. Install PyTorch with CUDA first (https://pytorch.org).
detectors = ["transformers>=4.40", "ultralytics>=8.3"]
dev = [
    "pytest>=8.3",
    "httpx2>=2.16",  # Starlette's TestClient uses it (plain httpx is deprecated there)
    "testcontainers[postgres]>=4.8",
    "packaging>=24",  # tests/dependencies reads the lock file with it
    "ruff>=0.17",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["annotator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: needs Docker (testcontainers Postgres migrated by Flyway)",
    "gpu: loads a real detector model (torch / ultralytics)",
]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# Ruff's defaults (E4, E7, E9, F) plus whitespace warnings, import order, likely bugs and modern syntax.
# Long lines (E501) aren't checked: there's no formatter yet, and wrapping by hand isn't worth the noise.
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies and uploads as default arguments; these calls are safe there.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query"]
