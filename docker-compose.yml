# claude-annotator v2
#
# Schema (Flyway, like backend_web): needs the local Supabase stack running (`supabase start`, db on :55322)
#   docker compose run --rm flyway migrate
#   docker compose run --rm flyway info
#   docker compose run --rm flyway validate
#
# The api, worker and web services are added as those parts are built.
services:
  flyway:
    image: flyway/flyway:11.3.4
    profiles: ["tools"]
    environment:
      FLYWAY_URL: ${FLYWAY_URL:-jdbc:postgresql://host.docker.internal:55322/postgres}
      FLYWAY_USER: ${FLYWAY_USER:-postgres}
      FLYWAY_PASSWORD: ${FLYWAY_PASSWORD:-postgres}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_SCHEMAS: public
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
      FLYWAY_CLEAN_DISABLED: "true"
    volumes:
      - ./backend/db/migration:/flyway/sql:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
